name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Run (offscreen, 5s)
        working-directory: assets/wl6
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          $proc = Start-Process -FilePath "..\..\build\Release\wolf3d.exe" -PassThru -NoNewWindow -RedirectStandardOutput run.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 5
          if (-not $proc.HasExited) { $proc.Kill(); Write-Host "PASS: still running after 5s" } else { exit $proc.ExitCode }
          Get-Content run.txt

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get install -y libx11-dev libxext-dev cmake ninja-build
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (strict warnings)
        run: cmake --build build -- CFLAGS='-Wall -Wextra -Wpedantic -Werror'
      - name: Run (offscreen, 5s)
        working-directory: assets/wl6
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          DISPLAY: ""
        run: |
          timeout 5 ../../build/wolf3d || code=$?
          if [ "$code" = "124" ] || [ "$code" = "" ]; then echo "PASS: ran 5s without crash"; else echo "FAIL: exit $code"; exit 1; fi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (strict warnings)
        run: cmake --build build -- CFLAGS='-Wall -Wextra -Wpedantic -Werror'
      - name: Run (offscreen, 5s)
        working-directory: assets/wl6
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          timeout 5 ../../build/wolf3d || code=$?
          if [ "$code" = "124" ] || [ -z "$code" ]; then echo "PASS: ran 5s without crash"; else echo "FAIL: exit $code"; exit 1; fi
