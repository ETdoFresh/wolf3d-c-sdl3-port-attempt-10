name: macOS Runtime Test
on: [push]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Run offscreen 6s
        working-directory: assets/wl6
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
                    ../../build/wolf3d & PID=$!; sleep 6; kill $PID 2>/dev/null; wait $PID 2>/dev/null; echo "PASS: ran 6s on macOS"
