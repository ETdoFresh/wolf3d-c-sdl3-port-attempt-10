name: macOS Runtime Test
on: [push]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Run offscreen 6s
        working-directory: assets/wl6
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          timeout 6 ../../build/wolf3d || code=$?
          if [ "$code" = "124" ] || [ -z "$code" ]; then echo "PASS: ran 6s on macOS"; else echo "FAIL: exit $code"; exit 1; fi
